# Smoke-test a draft kernel on a free CPU runner (tiny random models, offline) before it goes to Kaggle.
name: Draft test
on:
  push:
    branches: [main]
    paths: ["drafts/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers numpy requests
      - run: |
          for d in drafts/*/; do
            echo "== $d"; (cd $d && KAWKAB_TEST=1 python run.py && python -c "import json;import glob;d=json.load(open(glob.glob('phase*.json')[0]));print({k:(v.get('error') or round(v['eval_loss'],3)) for k,v in d['students'].items()})")
          done
