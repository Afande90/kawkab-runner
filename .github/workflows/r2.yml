name: r2 rebuild
on:
  push:
    branches: [main]
    paths: ["analysis/r2/**"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.53.3 numpy safetensors
          pip list 2>/dev/null | grep -iE "^(torch|transformers|numpy|safetensors) "
      - run: cd analysis/r2 && ./run.sh 2>&1 | grep -v -i warn
